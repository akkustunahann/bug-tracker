<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bug Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>Bug Tracker</h1>

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}

        <section class="form-section">

            <h2>Report New Bug</h2>

            <form id="bug-form" action="/add" method="POST">

                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter bug title"
                    required
                >

                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the bug"
                    required
                ></textarea>

                <label for="reported_by">Reported By</label>

                <input
                    type="text"
                    id="reported_by"
                    name="reported_by"
                    placeholder="Your name"
                    required
                >

                <button type="submit">
                    Add Bug
                </button>

            </form>

        </section>


        <section class="dashboard-section">

            <h2>Bug Dashboard</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Reported By</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>

                <tbody>

                    {% for bug in bugs %}

                    <tr>
                        <td>{{ bug[0] }}</td>
                        <td>{{ bug[1] }}</td>
                        <td>{{ bug[2] }}</td>
                        <td>{{ bug[3] }}</td>

                        <td>

                            <form action="/update_status" method="POST">

                                <input type="hidden" name="bug_id" value="{{ bug[0] }}">

                                <select name="status" onchange="this.form.submit()">

                                    <option value="Created"{% if bug[4] == "Created" %}selected{% endif %}>
                                        Created
                                    </option>

                                    <option value="In Progress"{% if bug[4] == "In Progress" %}selected{% endif %}>
                                        In Progress
                                    </option>

                                    <option value="Done"{% if bug[4] == "Done" %}selected{% endif %}>
                                        Done
                                    </option>

                                </select>

                            </form>

                        </td>

                        <td>{{ bug[5] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </section>

    </div>

    <script>

        const form = document.getElementById("bug-form");

        form.addEventListener("submit", function(event) {

        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const reporter = document.getElementById("reported_by").value;


        if(title.trim() === "" || 
            description.trim() === "" || 
            reporter.trim() === "") {

            alert("Please fill all fields!");
            event.preventDefault();
        }

        else {
            alert("Bug submitted successfully!");
        }

        });

    </script>

</body>

</html>
